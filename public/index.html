<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZPP Gold Trading — Buying, Inventory &amp; Liquidation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B19;
    --ink-2:#26241F;
    --paper:#F6F1E4;
    --paper-2:#EEE6D2;
    --paper-3:#E6DBBF;
    --line:#D7C79E;
    --line-soft:#E3D6AE;
    --brass:#A9791E;
    --brass-deep:#7C5A17;
    --brass-bright:#C9911F;
    --silver-m:#7C8792;
    --platinum-m:#4F7A73;
    --ink-soft:#5B5548;
    --sage:#5E6E45;
    --rust:#9A4630;
    --cream-text:#F6F1E4;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .is-hidden{display:none!important;}
  .login-screen{
    min-height:100vh;
    padding:36px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 72% 18%,rgba(201,145,31,.16),transparent 30%),
      linear-gradient(135deg,#151512,#222017);
    color:var(--cream-text);
  }
  .login-shell{width:min(880px,100%);}
  .login-brand{text-align:center;margin-bottom:28px;}
  .login-brand .brand-mark{margin:0 auto 14px;width:52px;height:52px;}
  .login-brand h1{font-family:'Fraunces',serif;font-size:34px;margin:0 0 7px;}
  .login-brand p{color:#B9AD8D;margin:0;font-size:13px;}
  .login-options{display:flex;justify-content:center;}
  .login-card{border:1px solid #4A4433;background:#201F1A;padding:26px;box-shadow:0 20px 55px rgba(0,0,0,.28);}
  .login-card.unified{width:min(430px,100%);border-top:3px solid var(--brass-bright);}
  .login-card.admin{border-top:3px solid var(--brass-bright);}
  .login-card.staff{border-top:3px solid var(--platinum-m);}
  .login-card h2{font-family:'Fraunces',serif;margin:0 0 5px;font-size:23px;}
  .login-card>p{font-size:12px;color:#B9AD8D;line-height:1.5;min-height:36px;margin:0 0 18px;}
  .login-card .field{margin-bottom:12px;}
  .login-card .field label{color:#C9BE9F;}
  .login-card input{background:#2B2922;border-color:#4A4433;color:var(--cream-text);width:100%;}
  .login-card .btn{box-sizing:border-box;min-width:0;justify-content:center;width:100%;border:1px solid var(--brass-bright);}
  .login-card.staff .btn{border-color:var(--platinum-m);}
  .login-error{min-height:18px;margin-top:10px;color:#E7A590;font-size:11.5px;}
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;
    flex:0 0 230px;
    background:var(--ink);
    color:var(--cream-text);
    padding:28px 0 20px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    border-right:1px solid #000;
  }
  .brand{
    padding:0 22px 22px;
    border-bottom:1px solid #38352C;
    margin-bottom:14px;
  }
  .brand-mark{
    width:40px;height:40px;
    border:1.5px solid var(--brass-bright);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:12px;
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand-name{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    line-height:1.15;
    color:var(--cream-text);
  }
  .brand-sub{
    font-size:11px;
    color:#A79A7B;
    margin-top:6px;
    letter-spacing:.02em;
  }
  nav.tabs{
    display:flex;
    flex-direction:column;
    padding:6px 10px;
    gap:1px;
    overflow-y:auto;
  }
  nav.tabs button{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    font-size:13.5px;
    color:#C9BE9F;
    border-left:2px solid transparent;
    display:flex;
    align-items:center;
    gap:10px;
    border-radius:2px;
  }
  nav.tabs button .dot{
    width:5px;height:5px;border-radius:50%;background:#55503F;flex:0 0 auto;
  }
  nav.tabs button:hover{color:var(--cream-text); background:#242119;}
  nav.tabs button.active{
    color:var(--cream-text);
    border-left:2px solid var(--brass-bright);
    background:#26231A;
    font-weight:600;
  }
  nav.tabs button.active .dot{background:var(--brass-bright);}
  .sidebar-foot{
    margin-top:auto;
    padding:16px 22px 0;
    border-top:1px solid #38352C;
    font-size:11px;
    color:#7C7258;
  }
  .sidebar-foot button{
    all:unset;cursor:pointer;color:#B08A3A;font-size:11px;text-decoration:underline;
  }
  .session-user{color:#C9BE9F;margin-bottom:7px;line-height:1.4;}
  .session-role{text-transform:uppercase;letter-spacing:.08em;font-size:9px;color:#7C7258;}

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    min-width:0;
    overflow-x:hidden;
    background:var(--paper);
    min-height:100vh;
    padding:34px 42px 60px;
  }
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:26px;
  }
  .page-head h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    margin:0;
    letter-spacing:-.01em;
  }
  .page-head .eyebrow{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .page-head .today{
    text-align:right;
    font-size:12px;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .page-session{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
  .access-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid currentColor;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.08em;line-height:1;}
  .access-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .access-badge.admin{color:var(--brass-deep);background:#EFE1B9;}
  .access-badge.staff{color:#3E6B64;background:#DCEAE5;}

  section.block{min-width:0;max-width:100%;margin-bottom:34px;}
  h2.block-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:18px;
    margin:0 0 14px;
    color:var(--brass-deep);
  }

  /* stat cards */
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
  .stat{
    flex:1 1 190px;
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:16px 18px;
  }
  .stat .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .stat .value{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;}
  .stat .sub{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  .bar-compare{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-row .bar-label{width:70px;font-size:12px;color:var(--ink-soft);flex:0 0 auto;}
  .bar-track{flex:1;height:14px;background:var(--paper-3);position:relative;}
  .bar-fill{height:100%;background:var(--brass);}
  .bar-fill.silver{background:var(--silver-m);}
  .bar-row .bar-value{width:120px;text-align:right;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:12px;flex:0 0 auto;}

  /* forms */
  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:14px 16px;
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:20px;
  }
  .field{display:flex;min-width:0;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;color:var(--ink-soft);}
  .field.span-2{grid-column:span 2;}
  input,select,textarea{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:8px 9px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--brass-bright);
    outline-offset:1px;
  }
  input[readonly]{color:var(--ink-soft);background:var(--paper-3);}
  textarea{resize:vertical;min-height:40px;}
  .field .hint{font-size:10.5px;color:var(--ink-soft);}

  .btn{
    all:unset;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:var(--cream-text);
    padding:9px 18px;
    font-size:13px;
    font-weight:600;
    border-radius:2px;
  }
  .btn:hover{background:var(--brass-deep);}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
  }
  .btn.secondary:hover{background:var(--ink);color:var(--cream-text);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn.danger{background:var(--rust);}
  .form-actions{margin-top:16px;display:flex;gap:10px;align-items:center;}
  .form-note{font-size:11.5px;color:var(--ink-soft);}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    text-align:left;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    padding:8px 10px;
    border-bottom:1.5px solid var(--ink);
    background:var(--paper);
    position:static;
  }
  thead th.num-head{text-align:right;}
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
    line-height:1.4;
  }
  tbody tr:hover{background:var(--paper-2);}
  .num{
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    text-align:right;
    white-space:nowrap;
  }
  .table-wrap{
    width:100%;
    max-width:100%;
    min-width:0;
    border:1px solid var(--line);
    overflow-x:auto;
    overflow-y:visible;
    background:var(--paper);
  }
  .table-wrap.short{overflow-x:auto;overflow-y:visible;}

  .pill{
    display:inline-block;
    padding:2px 8px;
    font-size:10.5px;
    border-radius:20px;
    border:1px solid currentColor;
  }
  .pill.selling{color:var(--sage);}
  .pill.refining{color:var(--silver-m);}
  .pill.hold{color:var(--rust);}
  .pill.liquidated{color:var(--ink-soft);}
  .pill.sold{color:var(--brass-deep);}
  .metal-tag{font-weight:600;}
  .metal-tag.gold{color:var(--brass-deep);}
  .metal-tag.silver{color:var(--silver-m);}
  .metal-tag.platinum{color:var(--platinum-m);}

  /* ---- rate sheet ---- */
  .metal-section{margin-bottom:30px;}
  .metal-section-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .metal-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .metal-dot.gold{background:var(--brass-bright);}
  .metal-dot.silver{background:var(--silver-m);}
  .metal-dot.platinum{background:var(--platinum-m);}
  .metal-section-head h3{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0;}
  .metal-section-head .count{font-size:12px;color:var(--ink-soft);}
  .metal-section-desc{font-size:12.5px;color:var(--ink-soft);max-width:640px;margin:0 0 14px;line-height:1.5;}

  .base-row{display:flex;gap:14px;align-items:stretch;margin-bottom:16px;flex-wrap:wrap;}
  .base-box{
    flex:0 0 220px;
    border:1.5px solid var(--brass-bright);
    background:var(--paper-2);
    padding:14px 16px;
  }
  .base-box .base-label{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:8px;}
  .base-box .base-input{display:flex;align-items:baseline;gap:6px;}
  .base-box .base-input span{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--brass-deep);}
  .base-box .base-input input{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;border:none;background:transparent;padding:0;width:120px;color:var(--ink);}
  .base-box .base-input input:focus{outline:none;border-bottom:1.5px solid var(--brass-bright);}

  .featured-box{
    flex:1 1 260px;
    background:var(--ink);
    color:var(--cream-text);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .featured-box .fx-label{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:#C9BE9F;}
  .featured-box .fx-grade{font-family:'Fraunces',serif;font-weight:700;font-size:22px;}
  .featured-box .fx-range{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;color:var(--brass-bright);}
  .featured-box select, .featured-box input{
    background:#2C2A22;border:1px solid #45412F;color:var(--cream-text);font-size:12px;padding:5px 7px;
  }
  .featured-box .fx-edit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .featured-box .fx-edit input{width:70px;}

  .grade-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:10px;
  }
  .grade-card{
    min-width:0;
    border:1px solid var(--line);
    background:var(--paper-2);
    padding:12px 14px;
  }
  .grade-card.is-override{border-color:var(--brass-bright);}
  .grade-card .gc-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .grade-card .gc-rate{display:flex;min-width:0;align-items:baseline;gap:5px;margin-bottom:6px;}
  .grade-card .gc-rate span.cur{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass-deep);}
  .grade-card .gc-rate .gc-value{
    flex:1 1 0;
    min-width:0;
    padding:2px 0;
    border-bottom:1px solid var(--line);
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:16px;
    font-weight:600;
    line-height:1.25;
    color:var(--ink);
    white-space:nowrap;
  }
  .grade-card .gc-rate input{
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:var(--ink);
    flex:1 1 0;
    min-width:0;
    width:auto;
    border:none;border-bottom:1px solid var(--line);background:transparent;padding:2px 0;
  }
  .grade-card .gc-rate input:focus{outline:none;border-bottom:1.5px solid var(--brass-bright);}
  .grade-card .gc-rate .unit{flex:0 0 auto;font-size:11px;color:var(--ink-soft);}
  .grade-card .gc-foot{font-size:10.5px;height:14px;}
  .grade-card .gc-foot .ov-tag{color:var(--brass-deep);}
  .grade-card .gc-foot button{all:unset;cursor:pointer;color:var(--ink-soft);text-decoration:underline;font-size:10.5px;}

  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;}
  .filter-row .field{min-width:130px;}

  .empty-note{
    padding:26px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    border:1px dashed var(--line);
    background:var(--paper-2);
  }
  .auto-panel{border:1.5px solid var(--brass-bright);background:var(--paper-2);padding:18px 20px;margin-bottom:24px;}
  .auto-panel-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .auto-panel h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 5px;}
  .auto-status{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:8px;}
  .auto-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .switch-line{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap;padding-bottom:8px;}
  .source-note{font-size:10.5px;color:var(--ink-soft);margin:12px 0 0;line-height:1.45;}
  .spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

  .item-check-row{
    display:grid;
    grid-template-columns:24px minmax(240px,1fr) 100px 100px 100px 110px 130px;
    gap:8px;
    align-items:center;
    padding:8px 10px;
    border-bottom:1px solid var(--line-soft);
    font-size:12px;
  }
  .item-check-wrap{width:100%;max-width:100%;overflow-x:auto;}
  .item-check-wrap .item-check-row{min-width:900px;}
  .item-check-row.head{
    font-size:10.5px;color:var(--ink-soft);font-weight:600;border-bottom:1.5px solid var(--ink);
  }
  .item-check-row input[type="number"]{width:100%;padding:5px 6px;font-size:12px;}

  .badge-count{
    background:var(--brass);
    color:var(--cream-text);
    font-size:10px;
    padding:1px 6px;
    border-radius:20px;
    margin-left:auto;
  }
  .toast{
    position:fixed;bottom:22px;right:22px;
    background:var(--ink);color:var(--cream-text);
    padding:12px 18px;font-size:13px;
    border-left:3px solid var(--brass-bright);
    box-shadow:0 4px 18px rgba(0,0,0,.25);
    z-index:999;
    max-width:320px;
    animation:toastin .2s ease-out;
  }
  .is-hidden{display:none!important;}
  .buying-workflow{border:1px solid var(--line);background:var(--paper-2);}
  .buying-step{display:grid;grid-template-columns:42px 1fr;gap:16px;padding:22px;}
  .buying-step+.buying-step{border-top:1px solid var(--line);}
  .step-number{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--cream-text);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;}
  .step-content h2{font-family:'Fraunces',serif;font-size:20px;margin:2px 0 3px;}
  .step-content>p{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}
  .buying-workflow .form-grid{background:transparent;border:0;padding:0;}
  .buying-customer-grid{grid-template-columns:minmax(220px,1.4fr) minmax(180px,1fr) minmax(150px,.8fr) minmax(150px,.8fr);}
  .buying-item-grid{grid-template-columns:repeat(5,minmax(135px,1fr));}
  .payout-calculator{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--paper);margin-top:18px;}
  .payout-calculator>div{padding:15px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line-soft);}
  .payout-calculator>div:last-child{border-right:0;}
  .payout-calculator span,.payout-calculator label{font-size:11px;color:var(--ink-soft);}
  .payout-calculator strong{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;}
  .payout-calculator .suggested{background:#E8D9AE;}
  .payout-calculator .suggested strong{font-size:19px;color:var(--brass-deep);}
  .final-payout{background:var(--ink);color:var(--cream-text);}
  .final-payout label{color:#C9BE9F;}
  .final-payout>div{display:flex;align-items:center;gap:7px;}
  .final-payout>div span{font-family:'Fraunces',serif;font-size:20px;color:var(--brass-bright);}
  .final-payout input{min-width:0;width:100%;padding:2px 0;border:0;border-bottom:1px solid #5B5548;background:transparent;color:var(--cream-text);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;}
  .override-reason{max-width:420px;margin-top:12px;}
  .buying-more{margin-top:16px;border-top:1px solid var(--line);padding-top:13px;}
  .buying-more summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-soft);width:max-content;}
  .buying-more summary span{font-weight:400;color:#8A826E;margin-left:4px;}
  .buying-more-grid{grid-template-columns:repeat(4,minmax(150px,1fr));margin-top:14px;}
  .buying-more textarea{min-height:34px;}
  .buying-add-action{margin-top:18px;}
